    <!-- Auto-recover from stale browser caches & service workers -->
    <script>
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {

          });

      } catch (e) {}
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        if (msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('Loading chunk') !== -1) {
          if (!sessionStorage.getItem('skillsprint_reload_once')) {
            sessionStorage.setItem('skillsprint_reload_once', '1');
            window.location.reload();
          }
        }
      });
    </script>
